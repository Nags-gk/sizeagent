name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Cache SKY130 models
        uses: actions/cache@v4
        with: {path: .pdk_src, key: sky130-fd-pr-v1}
      - name: Build SKY130 model libraries
        run: ./scripts/setup_pdk.sh
      - name: Install Python deps
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e .[dev]
      - name: Test
        run: pytest -q
