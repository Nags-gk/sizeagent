name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff mypy numpy && ruff check . && mypy
      - run: python scripts/scan_secrets.py
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Cache SKY130 models
        uses: actions/cache@v4
        with: {path: .pdk_src, key: sky130-fd-pr-v1}
      - name: Build SKY130 model libraries
        shell: bash
        run: |
          ./scripts/setup_pdk.sh 2>&1 | tee pdk.log || {
            echo "::error title=setup_pdk failed::$(tail -n 20 pdk.log | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          }
      - name: Install Python deps
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e .[dev]
      - name: Test
        run: pytest -q --cov=sizeagent
