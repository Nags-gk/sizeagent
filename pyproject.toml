[project]
name = "sizeagent"
version = "0.1.0"
description = "LLM agent + combinatorial optimization for SKY130 op-amp sizing with ngspice"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy", "torch", "optuna", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
sizeagent-agent = "sizeagent.agent.loop:main"

[tool.setuptools]
packages = ["sizeagent", "sizeagent.optimizers", "sizeagent.agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B007", "B905", "E402", "E702", "E401", "E741", "B023", "UP037"]

[tool.mypy]
ignore_missing_imports = true
files = ["sizeagent"]
